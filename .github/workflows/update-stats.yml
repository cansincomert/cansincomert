name: Update profile stats

on:
  schedule:
    # 04:17 UTC daily — off the hour to avoid GitHub's cron congestion
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token is configured
        env:
          PAT: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Secret GH_STATS_TOKEN is not set. Create a classic PAT with"
            echo "::error::the 'repo' AND 'read:org' scopes and add it at Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Recompute stats across all repos (private included)
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          chmod +x scripts/update-stats.sh
          ./scripts/update-stats.sh

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "stats unchanged" && exit 0
          git commit -m "chore: refresh profile stats"
          git push
